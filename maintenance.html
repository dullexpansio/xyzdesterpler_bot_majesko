<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Портал государственных услуг Российской Федерации</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6fa;
            color: #1f2937;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Верхняя белая шапка сайта */
        .top-header {
            background-color: #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 32px;
            border-bottom: 1px solid #e5e7eb;
        }

        .logo-block {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            font-size: 24px;
            font-weight: 700;
        }

        /* Иконка меню (три полоски) — синяя */
        .menu-icon {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 22px;
            height: 16px;
        }

        .menu-icon span {
            display: block;
            height: 2.5px;
            width: 100%;
            background-color: #005FF9;
            border-radius: 2px;
        }

        /* Разделение цветов в слове госуслуги */
        .logo-blue {
            color: #005FF9;
        }

        .logo-red {
            color: #ef4444;
        }

        .login-link {
            color: #005FF9;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
        }

        .login-link:hover {
            text-decoration: underline;
        }

        /* Синяя область поиска и быстрых ссылок */
        .hero-section {
            background-color: #005FF9;
            padding: 24px 32px 32px 32px;
        }

        .hero-container {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* Ряд верхних карточек-ссылок */
        .quick-cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 20px;
        }

        .quick-card {
            background: #ffffff;
            border-radius: 10px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: #1f2937;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            transition: background-color 0.2s;
        }

        .quick-card:hover {
            background-color: #f9fafb;
        }

        .quick-card-content {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .quick-card svg {
            width: 22px;
            height: 22px;
            fill: #005FF9;
        }

        .arrow-icon {
            color: #9ca3af;
            font-size: 14px;
        }

        /* Строка поиска */
        .search-bar {
            background: #ffffff;
            border-radius: 10px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .search-left {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #9ca3af;
            font-size: 15px;
            width: 100%;
        }

        .search-left svg {
            width: 20px;
            height: 20px;
            fill: #005FF9;
        }

        .search-btn-icon {
            background: #005FF9;
            border: none;
            border-radius: 8px;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
        }

        .search-btn-icon svg {
            width: 18px;
            height: 18px;
            fill: #ffffff;
        }

        /* Теги под поиском */
        .tags-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .tag-pill {
            background-color: rgba(255, 255, 255, 0.15);
            color: #ffffff;
            border-radius: 20px;
            padding: 7px 16px;
            font-size: 13px;
            text-decoration: none;
            transition: background-color 0.2s;
        }

        .tag-pill:hover {
            background-color: rgba(255, 255, 255, 0.25);
        }

        /* Основной центральный контент */
        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 50px 20px;
        }

        .maintenance-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.06);
            padding: 70px 60px;
            text-align: center;
            max-width: 680px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid #e5e7eb;
        }

        .icon-container {
            margin-bottom: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .tech-icon {
            width: 260px; /* Увеличено до большой полноценной картинки */
            height: auto;
            object-fit: contain;
        }

        .maintenance-card h1 {
            font-size: 26px;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 14px;
        }

        .maintenance-card p {
            font-size: 16px;
            color: #4b5563;
            line-height: 1.6;
        }

        /* Адаптивность для мобильных */
        @media (max-width: 768px) {
            .quick-cards {
                grid-template-columns: 1fr;
            }
            .top-header {
                padding: 12px 16px;
            }
            .hero-section {
                padding: 16px 16px 24px 16px;
            }
            .maintenance-card {
                padding: 40px 24px;
            }
            .tech-icon {
                width: 200px;
            }
        }
    </style>
</head>
<body>

    <!-- Верхняя шапка -->
    <header class="top-header">
        <a href="#" class="logo-block">
            <div class="menu-icon">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <span><span class="logo-blue">ГОС</span><span class="logo-red">УСЛУГИ</span></span>
        </a>
        <a href="#" class="login-link">Войти</a>
    </header>

    <!-- Синий поисковый блок -->
    <section class="hero-section">
        <div class="hero-container">
            <!-- Верхние три плашки -->
            <div class="quick-cards">
                <a href="#" class="quick-card">
                    <div class="quick-card-content">
                        <svg viewBox="0 0 24 24"><path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3M5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z"/></svg>
                        <span>Поступление в вуз онлайн</span>
                    </div>
                    <span class="arrow-icon">›</span>
                </a>
                <a href="#" class="quick-card">
                    <div class="quick-card-content">
                        <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zM7 10h2v7H7zm4-3h2v10h-2zm4 5h2v5h-2z"/></svg>
                        <span>ЖКХ в одном приложении</span>
                    </div>
                    <span class="arrow-icon">›</span>
                </a>
                <a href="#" class="quick-card">
                    <div class="quick-card-content">
                        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H7c0-2.76 2.24-5 5-5s5 2.24 5 5c0 1.03-.42 1.98-1.03 2.75z"/></svg>
                        <span>Служба по контракту</span>
                    </div>
                    <span class="arrow-icon">›</span>
                </a>
            </div>

            <!-- Поисковая строка -->
            <div class="search-bar">
                <div class="search-left">
                    <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                    <span>Введите запрос...</span>
                </div>
                <button class="search-btn-icon">
                    <svg viewBox="0 0 24 24"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg>
                </button>
            </div>

            <!-- Теги под поиском -->
            <div class="tags-row">
                <a href="#" class="tag-pill">Электронная трудовая</a>
                <a href="#" class="tag-pill">Лицевой счёт СФР</a>
                <a href="#" class="tag-pill">Загранпаспорт</a>
                <a href="#" class="tag-pill">Запись МВД</a>
                <a href="#" class="tag-pill">Выборы</a>
            </div>
        </div>
    </section>

    <!-- Центральный блок -->
    <main class="main-content">
        <div class="maintenance-card">
            <!-- Большая иконка из flags/tech.png -->
            <div class="icon-container">
                <img src="flags/tech.png" alt="Ведутся технические работы" class="tech-icon">
            </div>

            <h1>Ведутся технические работы</h1>
            <p>Это необходимо, чтобы Госуслуги работали лучше.<br>Зайдите на страницу чуть позже.</p>
        </div>
    </main>

</body>
</html>
