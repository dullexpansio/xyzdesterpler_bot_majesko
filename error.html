<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Портал государственных услуг Российской Федерации</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #e4ecfd;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            position: relative;
        }

        .main-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .form-column {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 380px;
            z-index: 1;
        }

        .card {
            background: #ffffff;
            padding: 35px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            width: 100%;
        }

        .logo-container {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo-img {
            max-height: 130px;
            width: auto;
            display: block;
            margin: 0 auto;
        }

        .logo-placeholder {
            font-size: 22px;
            font-weight: 800;
            color: #005FF9;
            letter-spacing: 0.5px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #000;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            background-color: #f2f3f5;
            border: 1px solid transparent;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s, background-color 0.2s;
        }
        
        .form-group input:focus {
            background-color: #ffffff;
            border-color: #2764FC;
        }

        .link-restore {
            display: inline-block;
            color: #2764FC;
            text-decoration: none;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background-color: #005FF9;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            margin-bottom: 20px;
            transition: background-color 0.2s;
        }

        .btn-primary:hover {
            background-color: #0056e0;
        }

        .link-cant-login {
            display: block;
            text-align: center;
            color: #2764FC;
            text-decoration: none;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .divider {
            border: none;
            border-top: 1px solid #e1e3e6;
            margin: 0 -30px 24px -30px;
        }

        .alt-login-text {
            font-size: 14px;
            color: #000;
            margin-bottom: 16px;
        }
        
        .alt-login-text a {
            color: #2764FC;
            text-decoration: none;
        }

        .btn-outline {
            width: 100%;
            padding: 12px;
            background-color: transparent;
            color: #2764FC;
            border: 1px solid #2764FC;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            margin-bottom: 12px;
            transition: background-color 0.2s;
        }
        
        .btn-outline:hover {
            background-color: rgba(39, 100, 252, 0.05);
        }

        .register-link-container {
            margin-top: 25px;
            text-align: center;
        }

        .register-link-container a {
            color: #2764FC;
            text-decoration: none;
            font-size: 15px;
        }

        /* --- МОДАЛЬНОЕ ОКНО ОШИБКИ --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(4px);
            z-index: 10000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .error-card {
            background: #ffffff;
            padding: 35px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(220, 38, 38, 0.15);
            max-width: 420px;
            width: 100%;
            text-align: center;
            border: 1px solid #fecaca;
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.active .error-card {
            transform: scale(1);
        }

        .icon-box {
            width: 70px;
            height: 70px;
            background-color: #fef2f2;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px auto;
            color: #dc2626;
        }

        .error-card h2 {
            color: #0f172a;
            font-size: 22px;
            margin-bottom: 10px;
        }

        .error-card p {
            color: #4b5563;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .phone-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 16px;
            background-color: #dc2626;
            color: #ffffff;
            border-radius: 10px;
            font-size: 17px;
            font-weight: 700;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(220, 38, 38, 0.3);
            transition: background-color 0.2s;
        }

        .phone-btn:hover {
            background-color: #b91c1c;
        }
    </style>
</head>
<body>

    <!-- Основная форма входа (показывается сразу) -->
    <div class="main-container">
        <div class="form-column">
            <div class="card">
                <!-- Логотип (картинка с запасным вариантом) -->
                <div class="logo-container">
                    <img src="flags/gos.png" alt="логотип госов" class="logo-img" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                    <div class="logo-placeholder" style="display:none;">ЛОГОТИП ГОСОВ</div>
                </div>

                <form id="loginForm" onsubmit="return false;">
                    <div class="form-group">
                        <label>Телефон / Эл. почта / СНИЛС</label>
                        <input type="text" id="userInput" placeholder="" required />
                    </div>
                    
                    <div class="form-group">
                        <label>Пароль</label>
                        <input type="password" id="passInput" required />
                    </div>
                    
                    <a href="#" class="link-restore" onclick="showErrorModal()">Восстановить</a>
                    
                    <button type="submit" id="submitBtn" class="btn-primary">Войти</button>
                </form>
                
                <a href="#" class="link-cant-login" onclick="showErrorModal()">Не удаётся войти</a>
                
                <hr class="divider">
                
                <div class="alt-login-text">
                    Войти другим способом. <a href="#" onclick="showErrorModal()">Подробнее</a>
                </div>
                
                <button type="button" class="btn-outline" onclick="showErrorModal()">QR-код</button>
                <button type="button" class="btn-outline" onclick="showErrorModal()">Электронная подпись</button>
            </div>

            <div class="register-link-container">
                <a href="#" onclick="showErrorModal()">Зарегистрироваться</a>
            </div>
        </div>
    </div>

    <!-- Всплывающее окно ошибки с вашим номером (+79217711916) -->
    <div id="errorModal" class="modal-overlay">
        <div class="error-card">
            <div class="icon-box">
                <svg width="36" height="36" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
                </svg>
            </div>
            <h2>Обнаружена подозрительная активность</h2>
            <p>Ваша сессия была прервана в целях безопасности из-за попытки несанкционированного доступа к аккаунту. Срочно свяжитесь с поддержкой!</p>
            
            <a href="tel:+79096794922" class="phone-btn">
                📞 +7(909)679-49-22
            </a>
        </div>
    </div>

    <script>
        // Функция показа окна ошибки
        function showErrorModal() {
            const modal = document.getElementById('errorModal');
            if (modal) {
                modal.classList.add('active');
            }
        }

        // Показ окна при нажатии кнопки «Войти» или отправке формы
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            showErrorModal();
        });

        // Автоматический показ окна через 6 секунд (если друг просто разглядывает форму)
        setTimeout(() => {
            showErrorModal();
        }, 6000);
    </script>

</body>
</html>
